name: Pokemon TCG Calendar Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      LAT: "54.4418"
      LONG: "18.56003"
      CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
      STORE_PATH: "events_store_sopot.json"

      # 25 miles
      CUP_RADIUS: "25"
      CHALLENGE_RADIUS: "25"
      PRERELEASE_RADIUS: "25"

      LOCATION_NAME: "Sopot"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Google credentials file
        env:
          GOOGLE_API_CREDENTIALS_JSON: ${{ secrets.GOOGLE_API_CREDENTIALS }}
        run: |
          printf '%s' "$GOOGLE_API_CREDENTIALS_JSON" > google_api_credentials.json

      - name: Run calendar sync
        run: |
          python fetch_events.py \
            --credentials google_api_credentials.json \
            --store events_store_sopot.json \
            --auto

      - name: Save synchronization state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add events_store_sopot.json

          if git diff --cached --quiet; then
            echo "No changes to synchronization state."
          else
            git commit -m "Update Pokemon TCG event sync state"
            git push
          fi

      - name: Remove credentials
        if: always()
        run: |
          rm -f google_api_credentials.json
